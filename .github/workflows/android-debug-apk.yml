name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [claude/youthful-tesla-yhfcaj]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Write build settings
        # Empty if the repository secrets are not set; the app then builds
        # without sign-in and works offline only.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg key "$SUPABASE_PUBLISHABLE_KEY" \
            --arg google "$GOOGLE_WEB_CLIENT_ID" \
            '{SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key, GOOGLE_WEB_CLIENT_ID: $google}' > env.json
      - run: flutter build apk --debug --dart-define-from-file=env.json
      - uses: actions/upload-artifact@v4
        with:
          name: wellbeing-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  release-build:
    # Proves the release build and the signing setup work, using a throwaway
    # key made here. The real signed build is android-release.yml.
    name: Release build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Make a throwaway signing key
        run: |
          keytool -genkeypair -keystore android/app/throwaway.jks -storepass throwaway -keypass throwaway \
            -alias throwaway -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI check"
          printf 'storeFile=app/throwaway.jks\nstorePassword=throwaway\nkeyAlias=throwaway\nkeyPassword=throwaway\n' > android/key.properties
      - run: flutter build apk --release
      - name: The release build is signed with that key, not the debug key
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          OUT=$($APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$OUT"
          echo "$OUT" | grep -q "CN=CI check"
          ! echo "$OUT" | grep -qi "Android Debug"

  supabase-schema:
    name: Backend schema tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -c 'create database wellbeing_test'
      - run: psql -v ON_ERROR_STOP=1 -d wellbeing_test -f supabase/tests/harness.sql
      - run: psql -v ON_ERROR_STOP=1 -d wellbeing_test -f supabase/migrations/20261007000000_private_data_and_sync.sql
      - name: Run schema tests
        run: psql -v ON_ERROR_STOP=1 -d wellbeing_test -f supabase/tests/rls_and_sync.sql
      - run: psql -v ON_ERROR_STOP=1 -d wellbeing_test -f supabase/migrations/20261008000000_groups.sql
      # Groups tests need a database of their own: they check exact weekly totals.
      - name: Run groups tests
        run: |
          psql -v ON_ERROR_STOP=1 -c 'create database wellbeing_groups'
          for f in tests/harness.sql migrations/20261007000000_private_data_and_sync.sql migrations/20261008000000_groups.sql tests/groups.sql; do
            psql -v ON_ERROR_STOP=1 -d wellbeing_groups -f supabase/$f
          done
      - name: Run delete-account tests
        run: |
          psql -v ON_ERROR_STOP=1 -c 'create database wellbeing_delete'
          for f in tests/harness.sql migrations/20261007000000_private_data_and_sync.sql migrations/20261008000000_groups.sql migrations/20261009000000_delete_account.sql tests/delete_account.sql; do
            psql -v ON_ERROR_STOP=1 -d wellbeing_delete -f supabase/$f
          done
